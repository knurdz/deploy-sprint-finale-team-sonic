name: PR Preview

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  preview:
    name: Build PR preview
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout PR commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: team-site/package-lock.json

      - name: Install dependencies
        working-directory: team-site
        run: npm ci

      - name: Build preview
        working-directory: team-site
        env:
          FEATURE_SHOW_INSIGHTS: ${{ secrets.FEATURE_SHOW_INSIGHTS }}
        run: npm run build

      - name: Verify T15 feature flag manifest
        shell: bash
        run: |
          set -euo pipefail

          FLAG_FILE="team-site/dist/runtime/feature-flags.json"

          if [ ! -f "$FLAG_FILE" ]; then
            echo "Feature flag manifest was not generated."
            exit 1
          fi

          node - <<'NODE'
          const fs = require('node:fs');

          const file = 'team-site/dist/runtime/feature-flags.json';
          const flags = JSON.parse(fs.readFileSync(file, 'utf8'));

          if (flags.task !== 'T15') {
            throw new Error('Missing T15 task marker.');
          }

          if (flags.feature !== 'showInsights') {
            throw new Error('Unexpected feature name.');
          }

          if (typeof flags.enabled !== 'boolean') {
            throw new Error('Enabled value must be Boolean.');
          }

          if (typeof flags.configured !== 'boolean') {
            throw new Error('Configured value must be Boolean.');
          }

          if (flags.valueRedacted !== true) {
            throw new Error('Feature flag evidence is not redacted.');
          }

          if (flags.source !== 'runtime-environment') {
            throw new Error('Runtime environment source marker is missing.');
          }

          console.log('T15 feature flag manifest verified safely.');
          console.log(`Configured: ${flags.configured}`);
          console.log(`Enabled: ${flags.enabled}`);
          NODE

      - name: Create preview manifest
        shell: bash
        run: |
          set -euo pipefail

          cat > team-site/dist/preview-manifest.json <<EOF
          {
            "task": "T11",
            "type": "pull-request-preview",
            "pullRequest": ${{ github.event.pull_request.number }},
            "commit": "${{ github.event.pull_request.head.sha }}",
            "branch": "${{ github.event.pull_request.head.ref }}",
            "repository": "${{ github.repository }}",
            "generatedBy": "PR Preview workflow",
            "productionDeployment": false,
            "featureFlagEvidence": "runtime/feature-flags.json"
          }
          EOF

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: pr-${{ github.event.pull_request.number }}-preview-${{ github.event.pull_request.head.sha }}
          path: team-site/dist
          if-no-files-found: error
          retention-days: 7

      - name: Publish preview summary
        shell: bash
        run: |
          {
            echo "## T11 PR Preview Evidence"
            echo ""
            echo "- Pull request: #${{ github.event.pull_request.number }}"
            echo "- Branch: \`${{ github.event.pull_request.head.ref }}\`"
            echo "- Commit: \`${{ github.event.pull_request.head.sha }}\`"
            echo "- Build result: successful"
            echo "- Preview artifact uploaded"
            echo "- Production deployment: not modified"
            echo ""
            echo "## T15 Feature Flag Evidence"
            echo ""
            echo "- Feature: \`showInsights\`"
            echo "- Source: GitHub Secret \`FEATURE_SHOW_INSIGHTS\`"
            echo "- Public evidence: \`runtime/feature-flags.json\`"
            echo "- Secret value: redacted"
            echo ""
            echo "The uploaded artifact contains the built team-site/dist output, preview-manifest.json, and safe redacted T15 feature flag evidence for this exact PR commit."
          } >> "$GITHUB_STEP_SUMMARY"